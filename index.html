const defaults={name:'壽星',logic:'682｜恰有一個數字正確且位置正確\n614｜恰有一個數字正確但位置錯誤\n206｜恰有兩個數字正確但位置錯誤\n738｜沒有任何數字正確\n780｜恰有一個數字正確但位置錯誤',answer:'042',logicHint:'先排除 7、3、8。',mem:[{q:'什麼東西越洗越小？（示範題）',a:'肥皂',img:'',full:''},{q:'什麼東西有很多牙齒卻不會咬人？（示範題）',a:'梳子',img:'',full:''},{q:'什麼東西越挖越大？（示範題）',a:'洞',img:'',full:''}],prizes:['生日零用金 NT$300','30 分鐘按摩券','下次約會餐廳決定權'],a:'',b:'',spots:[[16.3,13.6],[73,20],[27.7,55],[59,47],[84.7,76]],fragments:'2749',final:'9472',clue:'最大的數字在最前面。\n最小的數字在最後面。\n第二個數字是第四個數字的兩倍。',ending:'真正的生日禮物不需要解謎，也不需要任何交換條件。因為今天是妳的生日。生日快樂！',gift:'請向妳面前的主持人領取真正的生日禮物。'};

let level=0,mi=0,correct=0,choice=-1,swap=false,found=[],hint=-1,hints=0,locked=false;
function frame(title,body){app.innerHTML=`<div class="progress">${[1,2,3,4,5].map(i=>`<span class="${level>=i?'on':''}"></span>`).join('')}</div><section><small>LEVEL ${String(level).padStart(2,'0')} / 05</small><h2>${title}</h2>${body}</section>`}
function home(){level=0;app.innerHTML=`<section class="center"><small>TOP SECRET · BIRTHDAY MISSION</small><h1>生日機密行動</h1><p>${esc(cfg.name)}，妳的生日禮物已被系統鎖定。</p><p>完成五項任務，收集四枚密碼碎片，解鎖最終驚喜。</p><button class="wide" onclick="start()">接受任務</button></section>`}
function start(){round=0;mi=correct=0;choice=-1;swap=false;found=[];hint=-1;hints=0;locked=false;level=1;render()}
function win(){frame('任務完成',`<div class="center"><p>取得密碼碎片</p><div class="digits"><b>${esc(cfg.fragments[level-1])}</b></div><button class="wide" onclick="level++;render()">前往下一關</button></div>`)}
function render(){if(level===1)frame('機密任務啟動',cfg.logic.split('\n').map(x=>`<div class="clue">${esc(x)}</div>`).join('')+`<input id="ans" placeholder="輸入密碼" inputmode="numeric"><button class="wide" onclick="checkLogic()">驗證</button><button class="secondary wide" onclick="$('msg').textContent=cfg.logicHint">提示</button><p id="msg"></p>`);
if(level===2){let m=cfg.mem[mi];frame('消失的記憶',`<small>第 ${mi+1} / ${cfg.mem.length} 題｜每題答對才能繼續</small>${m.img?`<div class="pic"><img src="${esc(m.img)}"></div>`:''}<p>${esc(m.q)}</p><input id="ans" placeholder="輸入答案" onkeydown="if(event.key==='Enter')memoryCheck()"><button class="wide" onclick="memoryCheck()">確認</button><button class="secondary wide" onclick="$('msg').textContent='提示：'+cfg.mem[mi].a.slice(0,1)+'…'">提示</button><p id="msg"></p>`)}
if(level===3)frame('命運交易所',`<p>選一個信封。妳只有一次交換機會。</p><div class="row">${[0,1,2].map(i=>`<button class="envelope ${choice===i?'':'secondary'}" onclick="choose(${i})">✉<br>${'ABC'[i]}</button>`).join('')}</div><p>${choice<0?'請選擇':swap?'交換完成！':'確定嗎？還可以交換一次。'}</p><button class="wide" ${choice<0?'disabled':''} onclick="reveal()">開啟信封</button>`);
if(level===4)spotRender();
if(level===5)frame('最終密碼',`<div class="digits">${[...cfg.fragments].map(x=>`<b>${esc(x)}</b>`).join('')}</div><p style="white-space:pre-line">${esc(cfg.clue)}</p><input id="ans" inputmode="numeric" maxlength="4" placeholder="四位數密碼"><button class="wide" onclick="finalCheck()">解鎖</button><p id="msg"></p>`)}
function checkLogic(){if($('ans').value.trim()===cfg.answer)win();else $('msg').textContent='密碼錯誤，再試一次。'}
function normalizeMemory(v){return String(v??'').normalize('NFKC').trim().toLowerCase()}
function memoryMatches(expected,input){let v=normalizeMemory(input);return !!v&&String(expected??'').split(/[|｜]/).map(normalizeMemory).filter(Boolean).includes(v)}
function memoryCheck(){let m=cfg.mem[mi],input=$('ans').value,msg=$('msg');if(!normalizeMemory(input)){msg.className='error';msg.textContent='請先輸入答案。';return}if(!memoryMatches(m.a,input)){msg.className='error';msg.textContent='答案錯誤，請再試一次！';$('ans').focus();return}correct++;frame('記憶確認',`<p class="success">答對了！</p><p>目前答對 ${correct} / ${cfg.mem.length} 題</p>${m.full?`<div class="pic"><img src="${esc(m.full)}"></div>`:''}<button class="wide" onclick="nextMemory()">${mi+1<cfg.mem.length?'下一題':'領取密碼碎片'}</button>`)}
function nextMemory(){mi++;if(mi<cfg.mem.length)render();else win()}
function choose(i){if(choice===i)return;if(choice!==-1){if(swap)return;swap=true}choice=i;render()}
function reveal(){frame('交易完成',`<div class="center"><h2>${esc(cfg.prizes[choice])}</h2><button class="wide" onclick="win()">領取密碼碎片</button></div>`)}
function picture(b,edit=false,r=round){let g=cfg.rounds[r],src=b?g.b:g.a;return `<div class="pic" onclick="${edit?`markSpot(event,this,${r})`:'hit(event,this)'}">${src?`<img src="${esc(src)}">`:scene(b)}${g.spots.map((s,i)=>edit||found.includes(i)||hint===i?`<span class="mark ${!edit&&!found.includes(i)?'hint':''}" style="left:${s[0]}%;top:${s[1]}%"></span>`:'').join('')}</div>`}
function spotRender(){let g=cfg.rounds[round],y=app.querySelector('.spot-layout')?window.scrollY:0;frame('被竄改的記憶',`<p>第 ${round+1} / ${cfg.rounds.length} 組｜找出所有差異</p><p class="spot-status">第 ${round+1} 組 · 已找到 ${found.length} / ${g.spots.length}</p><div class="pair"><figure><figcaption>原始照片</figcaption>${picture(false)}</figure><figure><figcaption>修改照片</figcaption>${picture(true)}</figure></div><button class="secondary wide" ${hints>=2||found.length===g.spots.length?'disabled':''} onclick="hintSpot()">提示（剩餘 ${2-hints} 次）</button><p id="msg"></p>${found.length===g.spots.length?`<button class="wide" onclick="nextSpot()">${round+1<cfg.rounds.length?'完成本組，前往下一組':'修復完成，領取碎片'}</button>`:''}`);app.querySelector('section').classList.add('spot-layout');window.scrollTo(0,y)}
function nextSpot(){if(found.length!==cfg.rounds[round].spots.length)return;if(round+1===cfg.rounds.length){win();return}round++;found=[];hint=-1;hints=0;spotRender();window.scrollTo(0,0)}
function coords(e,el){let r=el.getBoundingClientRect();return [(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]}
function hit(e,el){let [x,y]=coords(e,el),i=cfg.rounds[round].spots.map((s,i)=>({i,d:Math.hypot(x-s[0],y-s[1])})).filter(o=>!found.includes(o.i)&&o.d<9).sort((a,b)=>a.d-b.d)[0]?.i??-1;if(i>=0){found.push(i);hint=-1;spotRender()}else $('msg').textContent='這裡沒有新的異常。'}
function hintSpot(){if(hints>=2)return;hint=cfg.rounds[round].spots.findIndex((s,i)=>!found.includes(i)&&i!==hint);if(hint>=0)hints++;spotRender()}
function finalCheck(){if($('ans').value.trim()!==cfg.final){$('msg').textContent='驗證失敗';return}frame('MISSION COMPLETE',`<div class="center"><h1>通關成功</h1><p>請領取通關紀念品。</p><button class="wide" onclick="ending()">發現隱藏信封</button></div>`)}
function ending(){frame('SECRET ENDING',`<div class="center"><h1>HAPPY BIRTHDAY</h1><p style="white-space:pre-line">${esc(cfg.ending)}</p><p>${esc(cfg.gift)}</p></div>`);for(let i=0;i<65;i++){let d=document.createElement('i');d.className='confetti';d.style.cssText=`left:${Math.random()*100}vw;background:${['#d6b779','#fff','#c47b89'][i%3]};animation-delay:${Math.random()}s`;document.body.append(d);setTimeout(()=>d.remove(),4200)}}
function field(k,label,multi=false){return `<label>${label}${multi?`<textarea onchange="cfg['${k}']=this.value">${esc(cfg[k])}</textarea>`:`<input value="${esc(cfg[k])}" onchange="cfg['${k}']=this.value">`}</label>`}
function admin(){if(!confirm('進入主持人設定？目前遊戲進度將於返回首頁後重置。'))return;settings()}
function settings(){app.innerHTML=`<section><h2>主持人設定</h2><p class="muted">設定後請儲存，並匯出玩家版 HTML 給壽星。照片會內嵌，不需網路。</p>${field('name','壽星稱呼')}${field('logic','第一關題目（每行一條）',true)}${field('answer','第一關答案')}${field('logicHint','第一關提示')}<h2>第二關｜回憶照片</h2>${cfg.mem.map((m,i)=>`<details open><summary>題目 ${i+1}</summary><label>題目<input value="${esc(m.q)}" onchange="cfg.mem[${i}].q=this.value"></label><label>答案（可用 | 分隔多個答案）<input value="${esc(m.a)}" onchange="cfg.mem[${i}].a=this.value"></label><label>局部照片<input type="file" accept="image/*" onchange="upload(this,'mem',${i},'img')"></label>${m.img?`<img width="100" src="${esc(m.img)}">`:''}<label>揭曉照片<input type="file" accept="image/*" onchange="upload(this,'mem',${i},'full')"></label>${m.full?`<img width="100" src="${esc(m.full)}">`:''}</details>`).join('')}<h2>第三關｜獎品</h2>${cfg.prizes.map((v,i)=>`<label>信封 ${'ABC'[i]}<input value="${esc(v)}" onchange="cfg.prizes[${i}]=this.value"></label>`).join('')}<h2>第四關｜找碴（三組）</h2><p>每組上傳兩張同尺寸照片，清除舊標記，再點擊照片設定任意數量的差異中心（每組至少一處）。</p>${cfg.rounds.map((g,i)=>`<details open><summary>第 ${i+1} 組｜${g.spots.length} 處</summary><label>原圖<input type="file" accept="image/*" onchange="upload(this,'round',${i},'a')"></label><label>修改圖<input type="file" accept="image/*" onchange="upload(this,'round',${i},'b')"></label><div class="pair"><figure><figcaption>原始照片</figcaption>${picture(false,true,i)}</figure><figure><figcaption>修改照片（點擊標記）</figcaption>${picture(true,true,i)}</figure></div><button class="secondary" onclick="editSpots(${i},false)">復原一處</button> <button class="secondary" onclick="editSpots(${i},true)">清除全部</button></details>`).join('')}<h2>第五關與結局</h2>${field('fragments','四枚碎片（四位數）')}${field('final','最終密碼')}${field('clue','排列提示',true)}${field('ending','隱藏結局文字',true)}${field('gift','禮物提示',true)}<button class="wide" onclick="save()">儲存設定</button><button class="wide" onclick="exportPlayer()">匯出玩家版 HTML</button><button class="secondary wide" onclick="home()">返回遊戲首頁</button><p id="msg"></p></section>`}
function refreshSettings(){let y=window.scrollY;settings();window.scrollTo(0,y)}
function markSpot(e,el,r){cfg.rounds[r].spots.push(coords(e,el));refreshSettings()}
function editSpots(r,clear){if(clear)cfg.rounds[r].spots=[];else cfg.rounds[r].spots.pop();refreshSettings()}
async function upload(el,k,i,f){let file=el.files[0];if(!file)return;let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1400/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.85);if(k==='mem')cfg.mem[i][f]=data;else if(k==='round'){let g=cfg.rounds[i];if(!g.a&&!g.b)g.spots=[];g[f]=data}else cfg[k]=data;URL.revokeObjectURL(url);refreshSettings()};im.src=url}
function valid(){if(cfg.mem.some(m=>!String(m.a??'').split(/[|｜]/).some(a=>normalizeMemory(a)))){alert('第二關每題至少需要一個非空白答案。');return false}if(!/^\d{4}$/.test(cfg.fragments)||[...cfg.fragments].sort().join('')!==[...cfg.final].sort().join('')||cfg.rounds.length!==3||cfg.rounds.some(g=>g.spots.length<1||!g.a||!g.b)){alert('請確認四位數密碼與碎片一致、三組找碴均須上傳兩張照片並設定至少一處差異。');return false}return true}
function save(){if(!valid())return;try{localStorage.setItem('projectBcfg',JSON.stringify(cfg));$('msg').textContent='設定已儲存。'}catch(e){$('msg').textContent='瀏覽器儲存空間不足，請直接匯出玩家版。'}}
function exportPlayer(){if(!valid())return;let html='<!doctype html>'+document.documentElement.outerHTML;html=html.replace('<div id="app">'+app.innerHTML+'</div>','<div id="app"></div>');html=html.replace('<button class="secondary" onclick="admin()">主持人</button>','');html=html.replace('let level=0,mi=0','cfg='+JSON.stringify(cfg).replace(/</g,'\\u003c')+';\nlet level=0,mi=0');let u=URL.createObjectURL(new Blob([html],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download='Project_B_Player.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
home();
</script></body></html>
